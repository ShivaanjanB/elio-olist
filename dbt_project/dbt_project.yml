# The dbt project for the Olist pipeline. Run dbt from this folder (see ../README.md).
#
# Layers (docs/data_model.md, decision D03):
#   staging       views   one model per RAW table: typed, renamed, normalised
#   intermediate  views   roll each child table up to order grain, rank each person's orders
#   marts         tables  the star schema: 4 dimensions and 2 facts, each with an enforced contract
name: olist
version: "1.0.0"
config-version: 2
profile: olist

# Pin the dbt version range this project was written and tested against (requirements.txt pins the exact one).
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
